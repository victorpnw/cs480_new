# ============================================================
# GitHub Actions CI Workflow
#
# This workflow runs automated checks (lint, type-check, tests)
# using pre-commit every time:
#   - A Pull Request is updated
#   - Code is pushed to main
#
# Think of CI as:
#   "The automated reviewer that never forgets to check anything."
# ============================================================

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  precommit:
    name: pre-commit (lint/format/tests)
    runs-on: ubuntu-24.04

    # services:
    #   postgres:
    #     image: postgres:15
    #     env:
    #       POSTGRES_USER: testuser
    #       POSTGRES_PASSWORD: testpass
    #       POSTGRES_DB: testdb
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.2.0"

      - name: Enable in-project venv
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            precommit-${{ runner.os }}-${{ steps.py.outputs.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # - name: Set test database environment
      #   run: |
      #     echo "DATABASE_URL_TEST=postgresql://testuser:testpass@localhost:5432/testdb" >> $GITHUB_ENV
      #     echo "DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb" >> $GITHUB_ENV

      # - name: Wait for PostgreSQL to be ready
      #   run: |
      #     for i in {1..30}; do
      #       if pg_isready -h localhost -p 5432 -U testuser -d testdb > /dev/null 2>&1; then
      #         echo "PostgreSQL is ready"
      #         exit 0
      #       fi
      #       echo "Waiting for PostgreSQL... ($i/30)"
      #       sleep 1
      #     done
      #     echo "PostgreSQL did not become ready in time"
      #     exit 1

      # - name: Initialize test database
      #   run: python scripts/init_test_db.py all
      #   env:
      #     DATABASE_URL_TEST: postgresql://testuser:testpass@localhost:5432/testdb

      - name: Run pre-commit on all files
        run: |
          poetry run pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Build Docker image
        run: docker build -t steelworks:ci .